apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mcpserverregistrations.mcp.kuadrant.io
spec:
  group: mcp.kuadrant.io
  names:
    kind: MCPServerRegistration
    listKind: MCPServerRegistrationList
    plural: mcpserverregistrations
    singular: mcpserverregistration
    shortNames:
      - mcpsr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetRef:
                  type: object
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                    - name
                prefix:
                  type: string
                path:
                  type: string
                state:
                  type: string
                  enum:
                    - Enabled
                    - Disabled
              required:
                - targetRef
          required:
            - spec
      subresources:
        status: {}
