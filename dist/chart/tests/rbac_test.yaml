suite: test rbac
templates:
  - rbac/manager-role.yaml
  - rbac/manager-rolebinding.yaml
  - rbac/leader-election-role.yaml
  - rbac/leader-election-rolebinding.yaml
tests:
  - it: should render manager ClusterRole
    template: rbac/manager-role.yaml
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mcp-lifecycle-operator-manager-role
      - isNotNull:
          path: rules
      - isNotEmpty:
          path: rules

  - it: should render manager ClusterRoleBinding
    template: rbac/manager-rolebinding.yaml
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mcp-lifecycle-operator-manager-rolebinding
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-mcp-lifecycle-operator-manager-role
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-mcp-lifecycle-operator-controller-manager
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE

  - it: should render leader election Role
    template: rbac/leader-election-role.yaml
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mcp-lifecycle-operator-leader-election-role
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotNull:
          path: rules

  - it: should render leader election RoleBinding
    template: rbac/leader-election-rolebinding.yaml
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mcp-lifecycle-operator-leader-election-rolebinding
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-mcp-lifecycle-operator-leader-election-role
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: RELEASE-NAME-mcp-lifecycle-operator-controller-manager

