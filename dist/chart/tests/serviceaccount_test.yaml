suite: test service account
templates:
  - rbac/controller-manager.yaml
tests:
  - it: should render service account with default values
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-mcp-lifecycle-operator-controller-manager
      - equal:
          path: metadata.namespace
          value: NAMESPACE
      - isNotNull:
          path: metadata.labels
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: mcp-lifecycle-operator
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  - it: should use custom name with nameOverride
    set:
      nameOverride: "custom-name"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-custom-name-controller-manager

  - it: should use custom name with fullnameOverride
    set:
      fullnameOverride: "completely-custom"
    asserts:
      - equal:
          path: metadata.name
          value: completely-custom-controller-manager

