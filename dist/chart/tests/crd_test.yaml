suite: test crd
templates:
  - crd/mcpservers.mcp.x-k8s.io.yaml
tests:
  - it: should render CRD by default
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - equal:
          path: metadata.name
          value: mcpservers.mcp.x-k8s.io
      - equal:
          path: spec.group
          value: mcp.x-k8s.io
      - equal:
          path: spec.names.kind
          value: MCPServer
      - equal:
          path: spec.names.plural
          value: mcpservers
      - equal:
          path: spec.scope
          value: Namespaced

  - it: should not render CRD when crd.enable is false
    set:
      crd.enable: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should have keep annotation when crd.keep is true
    set:
      crd.keep: true
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: should not have keep annotation when crd.keep is false
    set:
      crd.keep: false
    asserts:
      - isNull:
          path: metadata.annotations["helm.sh/resource-policy"]

