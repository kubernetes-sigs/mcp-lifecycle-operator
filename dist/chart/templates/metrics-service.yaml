apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-lifecycle-operator.fullname" . }}-metrics-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp-lifecycle-operator.labels" . | nindent 4 }}
spec:
  ports:
    - name: https
      port: {{ .Values.metrics.service.port }}
      protocol: {{ .Values.metrics.service.protocol }}
      targetPort: {{ .Values.metrics.service.port }}
  selector:
    {{- include "mcp-lifecycle-operator.selectorLabels" . | nindent 4 }}
