{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcp-lifecycle-operator.fullname" . }}-mcpserver-admin-role
  labels:
    {{- include "mcp-lifecycle-operator.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - mcp.x-k8s.io
    resources:
      - mcpservers
    verbs:
      - '*'
  - apiGroups:
      - mcp.x-k8s.io
    resources:
      - mcpservers/status
    verbs:
      - get
{{- end }}
