# Adds a writable coverage volume and GOCOVERDIR to the controller manager so a
# coverage-instrumented image can emit Go coverage data (see #177).
#
# The production securityContext sets readOnlyRootFilesystem, so coverage data
# cannot be written to the container filesystem; it is written to an emptyDir
# volume instead. fsGroup makes that volume writable by the non-root user (65532)
# the manager runs as.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
      containers:
      - name: manager
        env:
        - name: GOCOVERDIR
          value: /coverage
        volumeMounts:
        - name: coverage-data
          mountPath: /coverage
      volumes:
      - name: coverage-data
        emptyDir: {}
