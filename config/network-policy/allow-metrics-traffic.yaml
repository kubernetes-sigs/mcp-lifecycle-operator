# This NetworkPolicy allows ingress traffic
# with Pods running on namespaces labeled with 'metrics: enabled'. Only Pods on those
# namespaces are able to gather data from the metrics endpoint.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: mcp-lifecycle-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-metrics-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: mcp-lifecycle-operator
  policyTypes:
    - Ingress
  ingress:
    # Allow kubelet health probes (liveness/readiness) on port 8081
    - ports:
        - port: 8081
          protocol: TCP
    # Allow the kube-apiserver to reach the admission/conversion webhook on 9443.
    # The apiserver is off the pod network with no reliably selectable source, so
    # this rule permits 9443 from any source (same approach as the 8081 probe rule).
    - ports:
        - port: 9443
          protocol: TCP
    # This allows ingress traffic from any namespace with the label metrics: enabled
    - from:
      - namespaceSelector:
          matchLabels:
            metrics: enabled  # Only from namespaces with this label
      ports:
        - port: 8443
          protocol: TCP
