---
codecov:
  notify:
    after_n_builds: 1
    require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: 50..75

  status:
    project:
      default:
        enabled: true
        target: 70%
        threshold: 1%
        if_not_found: success
        if_no_uploads: success
        if_ci_failed: error
    patch:
      default:
        enabled: true
        target: 80%
        if_not_found: success
        if_no_uploads: success
        if_ci_failed: error
    changes: false

comment:
  layout: "header, diff"
  behavior: default
  require_changes: false

ignore:
  - "**/zz_generated.*.go"
  - "**/applyconfiguration/**"
  # TODO: lift when sigs.k8s.io/e2e-framework supports fake client unit testing
  # See: https://github.com/kubernetes-sigs/e2e-framework/pull/590
  - "test/e2e/**"
