---
codecov:
  notify:
    after_n_builds: 1
    require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: 50..75

  status:
    project:
      default:
        enabled: true
        target: 70%
        threshold: 1%
        if_not_found: success
        if_no_uploads: success
        if_ci_failed: error
    patch:
      default:
        enabled: true
        target: 80%
        if_not_found: success
        if_no_uploads: success
        if_ci_failed: error
    changes: false

# Coverage is uploaded under two flags (see #177):
#   unittests - from the Tests workflow, on every pull request and push to main
#   e2e       - from the E2E Tests workflow, on a nightly schedule / manual run
# carryforward keeps the last known coverage for a flag when a given CI run does
# not upload it (e.g. a PR uploads only unittests), so the combined project
# coverage stays meaningful instead of dropping to just one flag's contribution.
flags:
  unittests:
    paths:
      - .
    carryforward: true
  e2e:
    paths:
      - .
    carryforward: true

comment:
  layout: "header, diff, flags"
  behavior: default
  require_changes: false

ignore:
  - "**/zz_generated.*.go"
  - "**/applyconfiguration/**"
  # TODO: lift when sigs.k8s.io/e2e-framework supports fake client unit testing
  # See: https://github.com/kubernetes-sigs/e2e-framework/pull/590
  - "test/e2e/**"
