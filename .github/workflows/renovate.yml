name: update-versions-with-renovate

on:
  push:
    branches: [main]
  schedule:
    # https://crontab.guru/
    # once a day at midnight UTC
    - cron: '0 0 * * *'

permissions: {}

jobs:
  update-versions-with-renovate:
    runs-on: ubuntu-latest
    if: github.repository == 'kubernetes-sigs/mcp-lifecycle-operator'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # https://github.com/renovatebot/github-action
      - name: self-hosted renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
        with:
          # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: .github/renovate-config.js
        env:
          # TODO: drop back to `info` once the `repository-changed` abort is
          # diagnosed; the throw sites for it only log at debug level.
          LOG_LEVEL: debug
