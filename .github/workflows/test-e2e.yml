# Generated from kubebuilder template:
# https://github.com/kubernetes-sigs/kubebuilder/blob/v4.11.1/pkg/plugins/golang/v4/scaffolds/internal/templates/github/test-e2e.go

name: E2E Tests

on:
  pull_request:
    branches: ['main']
  # The e2e-coverage job is expensive (it rebuilds an instrumented image and
  # collects coverage from a live cluster), so it does not run on every PR.
  # It runs on a schedule and can be triggered manually. See #177.
  workflow_dispatch: {}
  schedule:
    # Nightly at 03:00 UTC.
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  test-e2e:
    name: Run on Ubuntu
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          KIND_VERSION=v0.32.0
          KIND_BINARY="kind-linux-$(go env GOARCH)"
          curl -Lo "./${KIND_BINARY}" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${KIND_BINARY}"
          curl -Lo "./${KIND_BINARY}.sha256sum" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${KIND_BINARY}.sha256sum"
          sha256sum -c "./${KIND_BINARY}.sha256sum"
          chmod +x "./${KIND_BINARY}"
          sudo mv "./${KIND_BINARY}" /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Deploy operator to Kind cluster
        run: make deploy-test-e2e

      - name: Run e2e tests
        run: make test-e2e

  test-e2e-gateway:
    name: Gateway (${{ matrix.provider }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: httproute
            deploy_target: deploy-test-e2e-httproute
          - provider: kuadrant
            deploy_target: deploy-test-e2e-kuadrant
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          KIND_VERSION=v0.32.0
          KIND_BINARY="kind-linux-$(go env GOARCH)"
          curl -Lo "./${KIND_BINARY}" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${KIND_BINARY}"
          curl -Lo "./${KIND_BINARY}.sha256sum" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${KIND_BINARY}.sha256sum"
          sha256sum -c "./${KIND_BINARY}.sha256sum"
          chmod +x "./${KIND_BINARY}"
          sudo mv "./${KIND_BINARY}" /usr/local/bin/kind

      - name: Deploy operator and gateway provider
        run: make ${{ matrix.deploy_target }}

      - name: Run gateway e2e tests
        run: make test-e2e-gateway GATEWAY_PROVIDER=${{ matrix.provider }}

  e2e-coverage:
    name: E2E code coverage
    # Only on schedule/manual runs: this rebuilds an instrumented image and
    # collects coverage from a live cluster, which is too slow for every PR. See #177.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          KIND_VERSION=v0.32.0
          KIND_BINARY="kind-linux-$(go env GOARCH)"
          curl -Lo "./${KIND_BINARY}" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${KIND_BINARY}"
          curl -Lo "./${KIND_BINARY}.sha256sum" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${KIND_BINARY}.sha256sum"
          sha256sum -c "./${KIND_BINARY}.sha256sum"
          chmod +x "./${KIND_BINARY}"
          sudo mv "./${KIND_BINARY}" /usr/local/bin/kind

      - name: Deploy coverage-instrumented operator to Kind cluster
        run: make deploy-test-e2e-cover

      - name: Run e2e tests and collect coverage
        # This runs the base e2e suite (make test-e2e) only. The gateway provider
        # suites (test-e2e-gateway: httproute, kuadrant) are intentionally not
        # included here, so code under internal/controller/providers/ will read as
        # 0% under the e2e flag even though the per-PR gateway jobs exercise it.
        # Folding gateway coverage into this job is tracked as a follow-up. See #177.
        run: make test-e2e-cover

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./out/e2e-coverage.out
          # Tag as e2e coverage so it can be compared side by side with the unit
          # test coverage uploaded by the Tests workflow. See #177.
          flags: e2e
          # This job runs only on schedule/dispatch on the protected main branch,
          # where Codecov rejects tokenless uploads ("Token required because branch
          # is protected"). Pass the repo upload token. See #177.
          token: ${{ secrets.CODECOV_TOKEN }}
          # This job runs only on schedule/dispatch, so fail the run on an upload
          # error rather than silently leaving the e2e flag empty.
          fail_ci_if_error: true
