name: Docs

on:
  pull_request:
    paths: &docs-paths
      - "site-src/**"
      - "mkdocs.yml"
      - "hack/mkdocs/**"
      - "crd-ref-docs.yaml"
      - "api/v1alpha1/**"
      - ".github/workflows/docs.yaml"
  push:
    branches:
      - main
    paths: *docs-paths
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (git tag, e.g. v0.1.0)"
        required: true
        type: string
      update_latest:
        description: "Update the latest alias to this version"
        type: boolean
        default: true
      set_default:
        description: "Set latest as the default site version"
        type: boolean
        default: true

# Serialize gh-pages deploys; keep PR lint runs independent.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-lint-pr-{0}', github.event.pull_request.number) || 'docs-deploy-gh-pages' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint docs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Clone the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hack/mkdocs/image/requirements.txt

      - name: Install docs dependencies
        run: pip install -r hack/mkdocs/image/requirements.txt

      - name: Build docs
        run: |
          make api-ref-docs
          mkdocs build --strict

  deploy-main:
    name: Deploy main preview
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hack/mkdocs/image/requirements.txt

      - name: Install docs dependencies
        run: pip install -r hack/mkdocs/image/requirements.txt

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy main preview
        run: ./hack/mkdocs/deploy.sh main --title "main (preview)"

  deploy-release:
    name: Deploy release docs
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hack/mkdocs/image/requirements.txt

      - name: Install docs dependencies
        run: pip install -r hack/mkdocs/image/requirements.txt

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy release docs
        run: ./hack/mkdocs/deploy.sh "${{ github.event.release.tag_name }}" latest --set-default

  deploy-manual:
    name: Deploy docs (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hack/mkdocs/image/requirements.txt

      - name: Install docs dependencies
        run: pip install -r hack/mkdocs/image/requirements.txt

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs
        env:
          VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
          SET_DEFAULT: ${{ inputs.set_default }}
        run: |
          ARGS=("${VERSION}")
          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            ARGS+=(latest)
          fi
          if [[ "${SET_DEFAULT}" == "true" ]]; then
            ARGS+=(--set-default)
          fi
          ./hack/mkdocs/deploy.sh "${ARGS[@]}"
