processor:
  # Ignore fields using regex patterns (RE2 syntax)
  ignoreFields:
    - "TypeMeta$"
    - "ObjectMeta$"
    - "ListMeta$"
  # Ignore types matching regex patterns
  ignoreTypes:
    - "()List$"

render:
  kubernetesVersion: "1.28"

# Source and output paths are supplied by hack/mkdocs/generate.sh CLI flags.
